<div class="customers-container">
  <!-- Tabs solo si NO está embebido en otro módulo -->
  <div class="module-tabs" *ngIf="!embedded">
    <button class="tab" [class.active]="activeTab === 'panel'" (click)="activeTab = 'panel'" type="button">Panel</button>
    <button class="tab" [class.active]="activeTab === 'list'" (click)="activeTab = 'list'" type="button">Clientes</button>
  </div>

  <!-- Panel Tab (solo si no está embebido) -->
  <div *ngIf="activeTab === 'panel' && !embedded">
    <app-customers-dashboard></app-customers-dashboard>
  </div>

  <!-- List Tab (siempre visible si embebido) -->
  <div *ngIf="activeTab === 'list' || embedded">
    <app-customers-list 
      [refreshTrigger]="refreshTrigger" 
      (openCreateModal)="showCreateModal = true">
    </app-customers-list>
  </div>
  
  <!-- Modal para crear cliente -->
  <div class="modal fade" [class.show]="showCreateModal" [style.display]="showCreateModal ? 'block' : 'none'" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-body">
          <app-customer-form 
            [isModal]="true" 
            (customerCreated)="onCustomerCreated()" 
            (formCancelled)="showCreateModal = false">
          </app-customer-form>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade" [class.show]="showCreateModal" *ngIf="showCreateModal"></div>
</div>
