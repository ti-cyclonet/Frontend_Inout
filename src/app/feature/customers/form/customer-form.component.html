<div class="customer-form-container">
  <div class="form-header">
    <h1 class="page-title">
      <span class="title-normal">Nuevo</span>
      <span class="title-bold">CLIENTE</span>
      <span class="dot">●</span>
    </h1>
  </div>

  <div class="form-content">
    <form [formGroup]="customerForm" (ngSubmit)="onSubmit()" class="customer-form">
      
      <!-- Fila 1: Email + Tipo Persona -->
      <div class="row-2">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" class="form-control" formControlName="email" placeholder="correo@ejemplo.com"
            [class.is-invalid]="customerForm.get('email')?.invalid && customerForm.get('email')?.touched">
        </div>
        <div class="form-group">
          <label>Tipo de Persona *</label>
          <div class="radio-row">
            <label class="radio-option">
              <input type="radio" formControlName="personType" value="N"> Natural
            </label>
            <label class="radio-option">
              <input type="radio" formControlName="personType" value="J"> Jurídica
            </label>
          </div>
        </div>
      </div>

      <!-- Fila 2: Documento -->
      <div class="row-3" [class.row-2]="isNaturalPerson">
        <div class="form-group">
          <label>Tipo Doc.</label>
          <select class="form-control" formControlName="documentType" title="Tipo de documento">
            <option *ngFor="let type of documentTypes" [value]="type.value"
              [hidden]="isNaturalPerson && type.value === 'NIT'">
              {{ type.label }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Nro. Documento</label>
          <input type="text" class="form-control" formControlName="documentNumber"
            [placeholder]="isNaturalPerson ? 'Máx. 10 dígitos' : 'Máx. 9 dígitos'"
            [maxlength]="isNaturalPerson ? 10 : 9">
        </div>
        <div class="form-group" *ngIf="isLegalEntity">
          <label>DV</label>
          <input type="text" class="form-control dv-input" formControlName="documentDv" placeholder="0" maxlength="1">
        </div>
      </div>

      <!-- Persona Natural -->
      <ng-container *ngIf="isNaturalPerson">
        <!-- Fila 3: Nombres -->
        <div class="row-4">
          <div class="form-group">
            <label>Primer Nombre</label>
            <input type="text" class="form-control" formControlName="firstName" placeholder="Nombre">
          </div>
          <div class="form-group">
            <label>Segundo Nombre</label>
            <input type="text" class="form-control" formControlName="secondName" placeholder="Opcional">
          </div>
          <div class="form-group">
            <label>Primer Apellido</label>
            <input type="text" class="form-control" formControlName="firstSurname" placeholder="Apellido">
          </div>
          <div class="form-group">
            <label>Segundo Apellido</label>
            <input type="text" class="form-control" formControlName="secondSurname" placeholder="Opcional">
          </div>
        </div>

        <!-- Fila 4: Datos personales + teléfono -->
        <div class="row-4">
          <div class="form-group">
            <label>Nacimiento</label>
            <input type="date" class="form-control" formControlName="birthDate">
          </div>
          <div class="form-group">
            <label>Estado Civil</label>
            <select class="form-control" formControlName="maritalStatus">
              <option value="">--</option>
              <option value="SOLTERO">Soltero(a)</option>
              <option value="CASADO">Casado(a)</option>
              <option value="UNION_LIBRE">Unión Libre</option>
              <option value="OTRO">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label>Sexo</label>
            <select class="form-control" formControlName="sex">
              <option value="">--</option>
              <option value="M">M</option>
              <option value="F">F</option>
              <option value="O">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" class="form-control" formControlName="phone" placeholder="300 000 0000">
          </div>
        </div>

        <!-- Fila 5: Dirección (full width) -->
        <div class="form-group">
          <label>Dirección</label>
          <input type="text" class="form-control" formControlName="address" placeholder="Dirección completa">
        </div>
      </ng-container>

      <!-- Persona Jurídica -->
      <ng-container *ngIf="isLegalEntity">
        <div class="row-2">
          <div class="form-group">
            <label>Razón Social</label>
            <input type="text" class="form-control" formControlName="businessName" placeholder="Nombre empresa">
          </div>
          <div class="form-group">
            <label>Dirección</label>
            <input type="text" class="form-control" formControlName="address" placeholder="Dirección">
          </div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label>Persona de Contacto</label>
            <input type="text" class="form-control" formControlName="contactPerson" placeholder="Nombre contacto">
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" class="form-control" formControlName="phone" placeholder="300 000 0000">
          </div>
        </div>
      </ng-container>

      <!-- Botones -->
      <div class="form-actions">
        <button type="button" class="btn btn-outline-secondary" (click)="onCancel()" [disabled]="loading">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="customerForm.invalid || loading">
          {{ loading ? 'Creando...' : 'Crear Cliente' }}
        </button>
      </div>
    </form>
  </div>
</div>
