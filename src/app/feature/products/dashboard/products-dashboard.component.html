<div class="dashboard-wrapper" style="height: 100%;">

  <div class="page-subtitle-row" style="border-top: 1px solid orange">
    <div class="page-subtitle">
      <svg viewBox="0 0 16 16">
        <use xlink:href="./assets/icons/bootstrap-icons.svg#speedometer2" />
      </svg>
      /Panel Principal
    </div>

    <div class="header-actions">
      <a class="action-link action-link-primary" (click)="navigateToCreate()" style="cursor:pointer;">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <use xlink:href="./assets/icons/bootstrap-icons.svg#plus-circle" />
        </svg>
        Producto
      </a>
    </div>
  </div>

  <div class="dashboard-container" style="border-bottom: 1px solid orange;">
    <!-- Indicadores en vivo (GET /dashboard/products) -->
    <app-products-insights></app-products-insights>
  </div>
</div>
