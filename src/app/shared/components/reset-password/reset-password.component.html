<div class="rp-page">
  <div class="rp-card">
    <img src="assets/img/logo_inout_v11.png" alt="InOut" class="rp-logo">
    <h1>Crea una nueva contraseña</h1>

    <ng-container *ngIf="!validToken">
      <p class="rp-error">El enlace no es válido. Solicita uno nuevo desde «¿Olvidaste tu contraseña?».</p>
      <button type="button" class="rp-btn" (click)="goToLogin()">Ir a iniciar sesión</button>
    </ng-container>

    <ng-container *ngIf="validToken && !done">
      <p class="rp-lead">La nueva contraseña aplica en todas las aplicaciones CycloNet.</p>
      <form (ngSubmit)="submit()">
        <label for="rpPassword">Nueva contraseña</label>
        <div class="rp-input">
          <input id="rpPassword" [type]="show ? 'text' : 'password'" name="password" autocomplete="new-password"
                 [(ngModel)]="password" minlength="6" required>
          <button type="button" (click)="show = !show" [attr.aria-label]="show ? 'Ocultar contraseña' : 'Mostrar contraseña'">{{ show ? 'Ocultar' : 'Ver' }}</button>
        </div>
        <label for="rpConfirm">Confirma la contraseña</label>
        <div class="rp-input">
          <input id="rpConfirm" [type]="show ? 'text' : 'password'" name="confirm" autocomplete="new-password"
                 [(ngModel)]="confirm" required>
        </div>
        <p class="rp-error" *ngIf="error">{{ error }}</p>
        <button type="submit" class="rp-btn" [disabled]="loading">{{ loading ? 'Guardando…' : 'Guardar contraseña' }}</button>
      </form>
    </ng-container>

    <ng-container *ngIf="done">
      <p class="rp-ok">{{ done }}</p>
      <button type="button" class="rp-btn" (click)="goToLogin()">Iniciar sesión</button>
    </ng-container>
  </div>
</div>
